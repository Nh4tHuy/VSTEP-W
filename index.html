<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSTEP Outline Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho giao diện Glassmorphism */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.8);
        }
        
        /* Font mượt mà hơn */
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .modal-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-cyan-100 to-blue-200 text-slate-800 p-2 sm:p-4 lg:p-6 flex justify-center items-center overflow-hidden">

    <!-- Main Container: Expanded for Laptop View -->
    <div class="w-[98vw] max-w-[1600px] h-[96vh] glass-panel shadow-2xl rounded-3xl flex flex-col overflow-hidden relative">
        
        <!-- Header / Navigation -->
        <div class="relative flex flex-col md:flex-row justify-between items-center p-4 sm:p-6 border-b border-white/50 bg-white/20 gap-4">
            <!-- Left Logo/Title -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
                <div class="p-2 bg-blue-500/20 rounded-xl text-blue-600 flex items-center justify-center shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></svg>
                </div>
                <h1 class="text-xl md:text-2xl font-bold text-blue-900 tracking-tight whitespace-nowrap">VSTEP</h1>
            </div>
            
            <!-- Center Timer -->

                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-pulse-slow"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="timer-text" class="font-mono text-xl sm:text-2xl font-bold tracking-wider">00:00</span>
            </div>

            <!-- Right Tabs -->
            <div class="flex bg-white/40 p-1.5 rounded-2xl border border-white/60 shadow-inner w-full md:w-auto justify-center">
                <button id="tab-practice" onclick="switchTab('practice')" class="flex items-center gap-2 px-4 md:px-6 py-2 rounded-xl font-medium transition-all duration-300 bg-blue-600 text-white shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
                    <span class="hidden sm:inline">Ôn Tập</span>
                </button>
                <button id="tab-config" onclick="switchTab('config')" class="flex items-center gap-2 px-4 md:px-6 py-2 rounded-xl font-medium transition-all duration-300 text-slate-700 hover:bg-white/60">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="hidden sm:inline">Cấu Hình</span>
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 custom-scrollbar relative">
            
            <!-- SECTION: PRACTICE -->
            <div id="section-practice" class="w-full max-w-6xl mx-auto flex flex-col animate-fade-in block">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white/30 p-4 rounded-2xl border border-white/50">
                    <div>
                        <h2 id="template-title" class="text-2xl sm:text-3xl font-extrabold text-slate-800">Title</h2>
                    </div>
                    <!-- Progress Bar mini -->
                    
                </div>

                <!-- Input Mode -->
                <div id="practice-input-mode" class="flex flex-col gap-4">
                    <div class="relative group">
                        <!-- Chiều cao thoải mái để gõ trên Laptop -->
                        <textarea
                            id="user-input"
                            oninput="updateWordCount()"
                            placeholder="Gõ dàn ý của bạn vào đây..."
                            class="w-full h-[45vh] lg:h-[55vh] p-6 rounded-2xl bg-white/70 border-2 border-white/80 shadow-inner focus:outline-none focus:border-blue-400 focus:bg-white focus:ring-4 focus:ring-blue-400/20 resize-none text-lg leading-relaxed text-slate-700 font-medium transition-all custom-scrollbar"
                        ></textarea>
                        
                    </div>

                    <div class="flex justify-end mt-1">
                        <button
                            id="btn-check"
                            onclick="handleCheck()"
                            class="w-full sm:w-auto flex items-center justify-center gap-2 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white px-10 py-3 rounded-xl font-bold shadow-xl shadow-blue-500/30 transition-all transform hover:-translate-y-1 opacity-50 cursor-not-allowed"

                        </button>
                    </div>
                </div>

                <!-- Result Mode -->
                <div id="practice-result-mode" class="hidden flex-col gap-6">

                    <div id="result-box" class="p-6 rounded-2xl border-2">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-4 mb-4 pb-4 border-b border-slate-200/50" id="result-header">
                            <!-- Injected by JS -->
                        </div>
                        
                        <!-- Diff Display -->
                        <div id="diff-content" class="text-lg leading-relaxed font-medium whitespace-pre-wrap text-slate-700 p-6 bg-white/95 rounded-xl shadow-inner border border-slate-200 font-serif min-h-[30vh]">
                            <!-- Injected by JS -->
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2">
                        <button
                            onclick="handleRetry()"
                            class="w-full sm:w-auto flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border-2 border-slate-200 px-8 py-3 rounded-xl font-bold shadow-sm transition-all hover:border-slate-300"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            Viết Lại Dàn Ý Này
                        </button>
                        <button
                            id="btn-next"
                            onclick="handleNext()"

                        >
                            <span>Dàn Ý Tiếp Theo</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

            </div>

            <!-- SECTION: CONFIG -->

                    <div>
                        <h2 class="text-2xl font-bold text-blue-900">Quản Lý Dàn Ý Mẫu</h2>
                    </div>
                    <div class="flex flex-wrap gap-3 w-full md:w-auto">

                            onclick="handleResetConfig()"

                            Khôi Phục Gốc
                        </button>

                            onclick="handleSaveConfig()"

                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            Lưu Thay Đổi
                        </button>
                    </div>
                </div>

                <div id="config-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 pb-10">
                    <!-- Config items injected by JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Overlay -->
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal(false)"></div>
        <!-- Modal Content -->
        <div class="relative modal-glass p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 border border-white transform scale-95 transition-transform duration-300" id="custom-modal-content">
            <div class="flex flex-col items-center text-center">
                <div id="modal-icon" class="w-16 h-16 rounded-full flex items-center justify-center mb-4">

                <h3 id="modal-title" class="text-2xl font-bold text-slate-800 mb-2">Title</h3>
                <p id="modal-message" class="text-slate-600 mb-8 leading-relaxed">Message</p>
                
                <div id="modal-buttons" class="flex gap-4 w-full">
                    <!-- Buttons injected via JS -->
                </div>
            </div>
        </div>
    </div>

        // State variables

        // Timer variables

        // Custom Modal Logic
        let modalConfirmCallback = null;

        function showModal(title, message, type = 'info', onConfirm = null) {
            const modal = document.getElementById('custom-modal');
            const modalContent = document.getElementById('custom-modal-content');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const iconEl = document.getElementById('modal-icon');
            const btnsEl = document.getElementById('modal-buttons');

            titleEl.innerText = title;
            msgEl.innerText = message;
            modalConfirmCallback = onConfirm;

                iconEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
            }

            // Setup Buttons
            btnsEl.innerHTML = '';
            if (type === 'info' || type === 'timeout') {
                const btnOk = document.createElement('button');
                btnOk.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-colors";
                btnOk.innerText = "Đã hiểu";

            } else if (type === 'confirm' || type === 'delete') {
                const btnCancel = document.createElement('button');

                btnCancel.innerText = "Hủy";

        function closeModal(isConfirm) {
            const modal = document.getElementById('custom-modal');
            const modalContent = document.getElementById('custom-modal-content');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
            modalContent.classList.remove('scale-100');

            if (isConfirm && modalConfirmCallback) {
                // Đợi animation chạy xong mới gọi callback
                setTimeout(() => {
                    modalConfirmCallback();
                    modalConfirmCallback = null;
                }, 300);
            }
        }

        function getTemplateDuration(template) {
            // Lấy thời gian từ config, quy đổi sang giây
            if (template.duration) {
                return template.duration * 60;
            }
            // Fallback nếu không có cấu hình duration (sẽ được init xử lý)
            return 3 * 60; 
        }

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            
            // Xóa hiệu ứng chờ
            const timerContainer = document.getElementById('timer-container');
            const icon = timerContainer.querySelector('svg');
            icon.classList.remove('animate-pulse-slow');
            timerContainer.classList.add('ring-2', 'ring-blue-400', 'ring-offset-2', 'ring-offset-blue-50');

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerUI();
                
                if (timeRemaining <= 0) {
                    stopTimer();
                    document.getElementById('user-input').setAttribute('disabled', 'true');
                    showModal('Hết giờ!', 'Đã hết thời gian quy định cho dàn ý này. Hệ thống sẽ tự động chấm điểm.', 'timeout', handleCheck);
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerStarted = false;
        }

        function resetTimer() {
            stopTimer();
            if(templates.length > 0) {
                timeRemaining = getTemplateDuration(templates[currentIndex]);
            } else {
                timeRemaining = 0;
            }
            updateTimerUI(true);
        }

        function updateTimerUI(isInitial = false) {
            const display = document.getElementById('timer-text');
            const container = document.getElementById('timer-container');
            const icon = container.querySelector('svg');
            
            display.innerText = formatTime(timeRemaining);

            if (isInitial) {
                // Trạng thái ban đầu
                container.className = "md:absolute md:left-1/2 md:transform md:-translate-x-1/2 flex items-center gap-2 px-5 py-2 bg-slate-700/80 text-white rounded-xl shadow-lg backdrop-blur-md transition-all duration-500 border border-slate-600/50";
                icon.classList.add('animate-pulse-slow');
                if (activeTab === 'practice') {
                    container.classList.remove('hidden');
                }
            } else {
                // Nhấp nháy đỏ khi còn < 1 phút
                if (timeRemaining <= 60 && timeRemaining > 0) {
                    container.classList.remove('bg-slate-700/80', 'ring-blue-400');
                    container.classList.add('bg-red-600', 'animate-pulse', 'ring-red-400');
                }
            }
        }

        // Standard helpers
        function normalizeString(word) {
            return word.replace(/[^\w\u00C0-\u1EF9]/gi, '').toLowerCase();
        }

        function getWordCount(text) {
            const noBrackets = text.replace(/\[.*?\]/g, '');
            const wordsArray = noBrackets.split(/[\s\n]+/).filter(w => normalizeString(w) !== '');
            return wordsArray.length;
        }

        function init() {
            const saved = localStorage.getItem('vstep-templates');
            if (saved) {
                try {
                    templates = JSON.parse(saved);
                    let needsSave = false;
                    
                    // Thêm trường duration nếu dữ liệu cũ chưa có
                    templates.forEach(t => {
                        if (t.duration === undefined) {
                            const id = (t.id || '').toLowerCase();
                            const title = (t.title || '').toLowerCase();
                            if (id.includes('email') || title.includes('email')) t.duration = 7;
                            else if (id.includes('essay') || title.includes('essay')) t.duration = 15;
                            else t.duration = 3;
                            needsSave = true;
                        }
                    });

                    defaultTemplates.forEach(defTpl => {
                        if (!templates.find(t => t.id === defTpl.id)) {
                            templates.push(defTpl);
                            needsSave = true;
                        }
                    });
                    if (needsSave) {
                        localStorage.setItem('vstep-templates', JSON.stringify(templates));
                    }
                } catch (e) {
                    templates = JSON.parse(JSON.stringify(defaultTemplates));
                }
            } else {
                templates = JSON.parse(JSON.stringify(defaultTemplates));
            }
            loadPracticeTemplate();
            renderConfigList();
        }

        function switchTab(tab) {
            activeTab = tab;
            
            const btnPractice = document.getElementById('tab-practice');
            const btnConfig = document.getElementById('tab-config');
            const secPractice = document.getElementById('section-practice');
            const secConfig = document.getElementById('section-config');
            const timerContainer = document.getElementById('timer-container');

            if (tab === 'practice') {
                btnPractice.className = "flex items-center gap-2 px-4 md:px-6 py-2 rounded-xl font-medium transition-all duration-300 bg-blue-600 text-white shadow-md";
                btnConfig.className = "flex items-center gap-2 px-4 md:px-6 py-2 rounded-xl font-medium transition-all duration-300 text-slate-700 hover:bg-white/60";
                secPractice.classList.remove('hidden');
                secPractice.classList.add('flex');
                secConfig.classList.add('hidden');

                if(currentIndex >= templates.length) currentIndex = 0;

        function loadPracticeTemplate() {
            if(templates.length === 0) {
                document.getElementById('template-title').innerText = "Chưa có dữ liệu";
                document.getElementById('user-input').setAttribute('disabled', 'true');
                document.getElementById('progress-bar').innerHTML = '';
                document.getElementById('timer-container').classList.add('hidden');
                return;
            } else {
                document.getElementById('user-input').removeAttribute('disabled');
            }

            document.getElementById('template-title').innerText = templates[currentIndex].title;
            
            // Reset and configure timer for this specific template
            resetTimer();

            // Progress Bar
            const maxDots = 20; 
            const progressContainer = document.getElementById('progress-bar');
            progressContainer.innerHTML = '';
            
            let startDot = 0;
            let endDot = templates.length;
            
            if (templates.length > maxDots) {
                startDot = Math.max(0, currentIndex - Math.floor(maxDots/2));
                endDot = Math.min(templates.length, startDot + maxDots);
                if (endDot - startDot < maxDots) {
                    startDot = Math.max(0, endDot - maxDots);
                }
            }

            for (let i = startDot; i < endDot; i++) {
                const div = document.createElement('div');
                div.className = `h-2 w-2 md:w-3 rounded-full transition-all ${i === currentIndex ? 'bg-blue-600 scale-125' : (i < currentIndex ? 'bg-blue-400' : 'bg-white/60')}`;
                div.title = `Bài ${i+1}`;
                progressContainer.appendChild(div);
            }

            const btnNextText = currentIndex < templates.length - 1 ? 'Dàn Ý Tiếp Theo' : 'Quay Lại Từ Đầu';
            document.querySelector('#btn-next span').innerText = btnNextText;

            const currentTemplateWords = getWordCount(templates[currentIndex].content);
            document.getElementById('word-count').setAttribute('data-target', currentTemplateWords);

            // Reset input and view
            document.getElementById('user-input').value = '';
            updateWordCount();
            
            document.getElementById('practice-input-mode').classList.remove('hidden');
            document.getElementById('practice-input-mode').classList.add('flex');
            document.getElementById('practice-result-mode').classList.add('hidden');
            document.getElementById('practice-result-mode').classList.remove('flex');
            
            // Auto focus
            setTimeout(() => document.getElementById('user-input').focus(), 100);

        function updateWordCount() {
            const val = document.getElementById('user-input').value;
            const words = getWordCount(val);
            const targetWords = document.getElementById('word-count').getAttribute('data-target') || 0;
            
            document.getElementById('word-count').innerText = `${words} / ${targetWords} từ`;
            
            // Start timer immediately upon first keystroke
            if (!timerStarted && val.trim().length > 0) {
                startTimer();
            }
            
            const btnCheck = document.getElementById('btn-check');
            if (val.trim().length > 0) {
                btnCheck.removeAttribute('disabled');
                btnCheck.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnCheck.setAttribute('disabled', 'true');
                btnCheck.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function tokenize(text) {
            const regex = /(\[.*?\]|[\s\n]+)/;
            return text.split(regex).filter(Boolean).map(part => {
                if (/^\[.*?\]$/.test(part)) return { text: part, type: 'placeholder' };
                if (/^[\s\n]+$/.test(part)) return { text: part, type: 'space' };
                return { text: part, type: 'word' };
            });
        }

        function computeDiffAdvanced(expected, actual) {
            const expTokens = tokenize(expected);
            const expWords = [];

            expTokens.forEach(t => {
                if (t.type === 'word') {
                    t.norm = normalizeString(t.text);
                    if (t.norm === '') {
                        t.type = 'punctuation';
                    } else {
                        t.matched = false;
                        expWords.push(t);
                    }
                }
            });

            const actTokens = tokenize(actual);
            const actWords = [];
            actTokens.forEach(t => {
                if (t.type === 'word' || t.type === 'placeholder') {
                    const norm = normalizeString(t.text);
                    if (norm !== '') actWords.push(norm);
                }
            });

            const m = expWords.length;
            const n = actWords.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (expWords[i - 1].norm === actWords[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            let i = m, j = n;
            while (i > 0 && j > 0) {
                if (expWords[i - 1].norm === actWords[j - 1]) {
                    expWords[i - 1].matched = true;
                    i--;
                    j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }

            const errors = expWords.filter(t => !t.matched).length;
            return { elements: expTokens, errorCount: errors };
        }

        function handleCheck() {
            const userInput = document.getElementById('user-input').value;
            // Stop timer when checking
            stopTimer();

            const templateContent = templates[currentIndex].content;
            const result = computeDiffAdvanced(templateContent, userInput);

            renderDiffResult(result);

            document.getElementById('practice-input-mode').classList.add('hidden');
            document.getElementById('practice-input-mode').classList.remove('flex');
            document.getElementById('practice-result-mode').classList.remove('hidden');
            document.getElementById('practice-result-mode').classList.add('flex');
        }

        function renderDiffResult(result) {
            const resultBox = document.getElementById('result-box');
            const resultHeader = document.getElementById('result-header');
            const diffContent = document.getElementById('diff-content');

            if (result.errorCount === 0) {
                resultBox.className = "p-6 rounded-2xl border-2 bg-green-50 border-green-200";
                resultHeader.innerHTML = `
                    <div class="bg-green-100 p-3 rounded-full text-green-600 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-green-700">Xuất sắc! Outline của bạn rất chuẩn xác.</h3>
                        <p class="text-sm text-green-600 mt-1">Đã hoàn thành trước khi hết giờ. Bạn đã gõ đúng toàn bộ các Keyword chính.</p>
                    </div>
                `;
            } else {
                resultBox.className = "p-6 rounded-2xl border-2 bg-white/90 border-red-200";
                resultHeader.innerHTML = `
                    <div class="bg-red-100 p-3 rounded-full text-red-500 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-red-600">Phát hiện ${result.errorCount} từ bị sai hoặc thiếu sót.</h3>
                        <p class="text-sm text-slate-500 mt-1">Hệ thống bôi đỏ chính xác những từ bị thiếu hoặc sai so với mẫu gốc.</p>
                    </div>
                `;
            }

            let htmlStr = '';
            result.elements.forEach(el => {
                const text = el.text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                if (el.type === 'space') {
                    htmlStr += text; 
                } else if (el.type === 'punctuation') {
                    htmlStr += `<span class="text-slate-800">${text}</span>`;
                } else if (el.type === 'placeholder') {
                    htmlStr += `<span class="text-blue-700 font-bold bg-blue-100/50 px-1 mx-[1px] rounded inline-block shadow-sm border border-blue-200">${text}</span>`;
                } else if (el.type === 'word') {
                    if (el.matched) {
                        htmlStr += `<span class="text-slate-800">${text}</span>`;
                    } else {
                        htmlStr += `<span class="inline-block bg-red-100 text-red-700 font-bold border-b-[3px] border-red-500 mx-[1px] px-1 rounded-sm cursor-help transition-all hover:bg-red-200" title="Từ này bị sai hoặc thiếu">${text}</span>`;
                    }
                }
            });
            diffContent.innerHTML = htmlStr;
        }

            const addDiv = document.createElement('div');
            addDiv.className = "bg-blue-50/70 p-6 rounded-2xl shadow-sm border-2 border-blue-200 border-dashed flex flex-col justify-center items-center min-h-[220px] cursor-pointer hover:bg-blue-100 transition-all hover:scale-[1.02] transform";
            addDiv.onclick = handleAddNewTemplate;
            addDiv.innerHTML = `
                <div class="bg-blue-600 text-white p-4 rounded-full mb-4 shadow-lg shadow-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </div>
                <h3 class="font-bold text-blue-800 text-lg">Thêm Dàn Ý / Câu Mới</h3>
            `;
            container.appendChild(addDiv);

            templates.forEach((template, index) => {
                const div = document.createElement('div');
                div.className = "bg-white/80 p-5 rounded-2xl shadow-md border border-white focus-within:ring-2 focus-within:ring-blue-400 focus-within:border-transparent transition-all relative group flex flex-col h-full";
                
                // Hiển thị phần nhập Tên, Thời gian và text Content
                div.innerHTML = `
                    <div class="flex flex-col mb-3 gap-2">
                        <div class="flex justify-between items-start gap-2">
                            <input type="text" value="${template.title}" 
                                class="font-bold text-slate-800 bg-white/50 rounded-lg border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 w-full px-2 py-1 transition-all"
                                onchange="updateTemplateTitle(${index}, this.value)"
                                placeholder="Tên dàn ý..."
                            />
                            <button onclick="handleDeleteTemplate(${index})" class="text-red-400 hover:text-red-600 p-2 bg-red-50 hover:bg-red-100 rounded-lg opacity-100 md:opacity-0 group-hover:opacity-100 transition-all" title="Xóa dàn ý này">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                            </button>
                        </div>
                        <div class="flex items-center gap-2 px-2">
                            <label class="text-sm text-slate-600 font-medium">Thời gian (phút):</label>
                            <input type="number" min="1" max="120" value="${template.duration || 3}" 
                                class="w-16 text-center font-bold text-blue-700 bg-white/50 rounded-lg border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 py-1 transition-all"
                                onchange="updateTemplateDuration(${index}, this.value)"
                            />
                        </div>
                    </div>
                    <textarea 
                        id="config-textarea-${index}"
                        class="w-full flex-1 min-h-[160px] p-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:outline-none focus:border-blue-400 resize-none text-sm leading-relaxed text-slate-700 font-serif custom-scrollbar"
                        oninput="updateTemplateContent(${index}, this.value)"
                        placeholder="Nội dung dàn ý..."
                    >${template.content}</textarea>
                `;
                container.appendChild(div);
            });
        }

        function updateTemplateTitle(index, newTitle) {
            templates[index].title = newTitle;
        }
        
        function updateTemplateDuration(index, newDuration) {
            const mins = parseInt(newDuration);
            if (!isNaN(mins) && mins > 0) {
                templates[index].duration = mins;
            }
        }

        function updateTemplateContent(index, newValue) {
            templates[index].content = newValue;
        }
        
        function handleAddNewTemplate() {
            const newId = 'custom-' + Date.now();
            templates.unshift({
                id: newId,
                title: 'Dàn ý mới',
                content: '',
                duration: 5 // Mặc định 5 phút khi thêm mới
            });
            renderConfigList();
        }

        function handleDeleteTemplate(index) {
            showModal(
                'Xác nhận xóa', 
                `Bạn có chắc chắn muốn xóa dàn ý "${templates[index].title}" không? Hành động này không thể hoàn tác.`, 
                'delete', 
                () => {
                    templates.splice(index, 1);
                    renderConfigList();
                }
            );
        }

        function handleSaveConfig() {
            templates = templates.filter(t => t.title.trim() !== '' && t.content.trim() !== '');
            localStorage.setItem('vstep-templates', JSON.stringify(templates));
            showModal('Thành công!', 'Đã lưu cấu hình các dàn ý thành công vào trình duyệt của bạn.', 'info');
            renderConfigList(); 
        }

        function handleResetConfig() {
            showModal(
                'Khôi phục mặc định', 
                "Bạn có chắc muốn khôi phục toàn bộ dàn ý về mặc định ban đầu không? Mọi dàn ý thêm mới và chỉnh sửa của bạn sẽ bị mất hoàn toàn.", 
                'confirm',
                () => {
                    templates = JSON.parse(JSON.stringify(defaultTemplates));
                    localStorage.removeItem('vstep-templates');
                    renderConfigList();
                }
            );
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
